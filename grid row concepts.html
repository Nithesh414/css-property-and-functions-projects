<!DOCTYPE html>
<html>
<head>
  <title>Simple Grid Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 80%;
      margin: 40px auto;
    }

    .box {
      background-color: lightblue;
      padding: 60px 0;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    /* Make first box bigger */
    .box1 {
      grid-column: 1 / 3;
    }
  </style>
</head>
<body>

  <h2 style="text-align:center;">Simple Grid Gallery</h2>

  <div class="container">
    <div class="box box1">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
  </div>

</body>
</html>
