<html>
    <head><title>
        clock
    </title></head>


    <style>
body{
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
    
}
.divcon{

   
display: flex;

justify-content: space-around;
align-items: center;gap:10px;
 width:600px;
    height: 300px;
    background:linear-gradient(85deg,  black,grey);

    border: 2px solid bisque;
}

.divcon p{
    text-align: center;
    color: orange;
    font-weight: bold;
    font-size: 40px;
    border: 1px solid bisque;
    width:60px;
    height: 50px;
}
</style>
    <body>



        <div  class="divcon"  id="divcon">

            <p  id="hour">0</p>
            <p id="min">0</p>
            <p id="sec">0</p>
            <p id="session">am</p>

        </div>



    </body>
    <script>

let minp=document.getElementById('min');
let hourp=document.getElementById('hour');
let secp=document.getElementById('sec');
let sessionp=document.getElementById('session');


let sec = 50;
let min = 59;
let hour = 11;
let session = "pm";

setInterval(() => {

    sec++;

    if (sec == 60) {
        sec = 0;
        min++;

        if (min == 60) {
            min = 0;
            hour++;

            if (hour == 12) {
                session = (session === "am") ? "pm" : "am";
            }

            if (hour > 12) {
                hour = 1;
            }
        }
    }

    sessionp.innerText = session;
    secp.innerText = sec;
    minp.innerText = min;
    hourp.innerText = hour;

}, 1000);
        
    </script>
</html>
