<html>
  <head>
    <title>Flexbox Example</title>
    <style>
       .container {
        display: flex;
        justify-content: space-around;
        align-items: center;
        height: 100vh;  
      }
      .item1, .item2, .item3 {
        width: 100px;
        height: 100px;
      }
      .item1 {
        background-color: red;
      }
      .item2 {
        background-color: green;
      }
      .item3 {
        background-color: blue;
      }
    
     </style>
</head>
<body>
  
<div class="container">
  <div class="item1"></div>
  <div class="item2"></div>
  <div class="item3"></div>
</div>

</body>
    </html>
